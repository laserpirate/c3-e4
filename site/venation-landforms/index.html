<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Venation landforms v01</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="lib/vena-shell.css">
<style>
/* vena-kodama viewer v02: the Land page layout on the dark ground of the kodama drawings. Labels 16 px (12 pt), titles 19 px (14 pt). */
:root{--bg:#07090e;--panel:#10131c;--ink:#dddee4;--mute:#8b8ba3;--line:#2c3150;--acc:#9fc8f0;--acc2:#e6deff;color-scheme:dark;
 --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--sans);margin:0;padding:0 16px 16px}
header{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;border-bottom:1px solid var(--line)}
h1{font:500 19px var(--sans);margin:0}
header .sub{color:var(--mute);font:16px var(--mono)}
header a{color:var(--acc);font:16px var(--mono)}
details.grp>summary{font:500 16px var(--mono);letter-spacing:.02em;text-transform:none;color:var(--ink)}
details.grp>summary button.gr{font:16px var(--mono)}
details.grp>summary .gchg{font-size:16px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:4px 8px;align-items:center;font-size:16px;border-left:3px solid transparent;padding-left:6px;margin-left:-9px}
.row.chg{border-left-color:var(--acc2)}
.hint.nar{color:#f0be78}
.row .was{grid-column:1/3;font:16px var(--mono);color:var(--acc2)}.row .was:empty{display:none}
.row .hint,.hint{grid-column:1/3;font:16px/1.3 var(--mono);color:var(--mute)}.row .hint:empty{display:none}
.row input[type=range]{grid-column:1/3;width:100%;accent-color:var(--acc);margin:0}
.row select{grid-column:1/3;min-width:0;width:100%}
.row input[type=number]{font:16px var(--mono);background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:3px 6px;width:100%;border-radius:0}
select,button,textarea{font:16px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:5px 8px;border-radius:0}
button{cursor:pointer}button:hover{border-color:var(--ink)}
textarea{width:100%;font:16px var(--mono)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.links{display:flex;flex-direction:column;gap:4px}.links a{color:var(--acc);font:16px var(--mono)}
.rlist{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto}
.rlist button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;padding:5px 8px}
.rlist button b{font:500 16px var(--sans)}.rlist button span{font:16px/1.25 var(--mono);color:var(--mute)}
.rlist button.on{border-color:var(--acc2)}.rlist button.on b{color:var(--acc2)}
table.mx{border-collapse:collapse;width:100%}
table.mx th{font:16px/1.15 var(--mono);color:var(--mute);font-weight:400;text-align:left;padding:2px 4px 2px 0;vertical-align:bottom}
table.mx td{padding:2px}
table.mx button.st{width:100%;font:500 16px var(--mono);padding:6px 0}
table.mx button.st.on{border-color:var(--acc2);color:var(--acc2)}
label.ck{display:flex;gap:8px;align-items:flex-start;font:16px/1.3 var(--mono);color:var(--acc)}
label.ck input{accent-color:var(--acc);width:18px;height:18px;flex:none;margin-top:2px}
.read{display:flex;flex-direction:column;gap:6px}.read div{display:flex;flex-direction:column;border-bottom:1px solid var(--line);padding-bottom:4px}
.read b{font:500 16px var(--sans)}.read span{font:16px/1.3 var(--mono);color:var(--mute);overflow-wrap:anywhere}
.drawing{flex:1 1 auto;min-height:320px;position:relative;border:1px solid var(--line);background:#07090e}
#gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sec{width:100%;height:100%;display:none}
#cap .c1{font:19px/1.3 var(--mono);color:var(--ink)}#cap .c2{font:16px/1.3 var(--mono);color:var(--mute)}
@media (max-width:1099.98px){.drawing{height:46vh;flex:none}}
</style>
</head>
<body>
<div class="frame">
<header><h1>Venation landforms v01</h1><span class="sub">C3-E4</span><a href="../">C3-E4 home</a></header>
<div class="app">
 <div class="rail" id="rail"></div>
 <div class="stage">
  <div class="drawing" id="draw" data-drawing><canvas id="gl"></canvas><div id="sec"></div></div>
  <div class="stagefoot" id="cap"></div>
 </div>
 <div class="rail" id="rail2"></div>
</div>
</div>
<script>const VERSION='v02';</script>
<script src="lib/d3-delaunay.min.js"></script>
<script src="lib/wing_geom.js"></script>
<script src="lib/vena-engine.js"></script>
<script src="lib/vena-shell.js"></script>
<script src="data/C3-E4_vk_data_O1_v02.js"></script>
<script src="data/C3-E4_vk_data_O2_v02.js"></script>
<script src="data/C3-E4_vk_data_O3_v02.js"></script>
<script src="data/C3-E4_vk_data_O4_v02.js"></script>
<script src="data/C3-E4_vk_data_O5_v02.js"></script>
<script src="data/C3-E4_vk_data_O6_v02.js"></script>
<script src="data/C3-E4_vk_data_O7_v02.js"></script>
<script src="data/C3-E4_vk_data_O7b_v02.js"></script>
<script src="C3-E4_vk_viewer_v02.js"></script>
</body>
</html>
